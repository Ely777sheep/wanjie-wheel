<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>&#19975;&#30028;&#36716;&#30424; &#183; &#34701;&#21512;&#25112;&#21147;&#27169;&#25311;&#22120;</title>
<style>
:root{
  --bg:#0a0b14; --bg2:#11131f; --card:#171a2b; --card2:#1e2236;
  --line:#2a2f4a; --txt:#e8eaf6; --dim:#9aa1c0; --dim2:#6b7396;
  --gold:#e8c37a; --red:#e5484d; --cyan:#4cc9f0; --violet:#b388ff; --green:#63d471;
  --jjk:#e5484d; --lotm:#b388ff; --hsr:#4cc9f0; --fgo:#e8c37a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  overscroll-behavior:none}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 50% -10%, #1b1f3a 0%, transparent 60%),
  radial-gradient(800px 400px at 100% 100%, #1a1230 0%, transparent 55%), var(--bg);}
#app{max-width:520px;margin:0 auto;padding:14px 14px 96px;position:relative}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.logo{font-weight:800;font-size:19px;letter-spacing:1px;
  background:linear-gradient(92deg,var(--gold),#fff3d0 40%,var(--violet) 75%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:10px;letter-spacing:2px;color:var(--dim2);
  -webkit-text-fill-color:var(--dim2);font-weight:500;margin-top:2px}
.spacer{flex:1}
.modebtn{font-size:11px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--dim);cursor:pointer;white-space:nowrap}
.modebtn b{color:var(--gold)}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.card h3{margin:0 0 10px;font-size:14px;letter-spacing:.5px;color:var(--txt);
  display:flex;align-items:center;gap:8px}
.card h3 .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.sub{font-size:11px;color:var(--dim2);line-height:1.7}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px;border-radius:14px;border:1px solid #333a5c;cursor:pointer;
  background:linear-gradient(180deg,#2a3050,#1d2137);color:var(--txt);
  font-size:15px;font-weight:700;letter-spacing:2px;transition:.18s;user-select:none}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(95deg,#8a5a1e,#e8c37a 45%,#a86b2a);color:#241505;
  border-color:#f0d9a6;box-shadow:0 8px 24px rgba(232,195,122,.22)}
.btn.primary:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px dashed #3a4166;color:var(--dim);font-weight:500;letter-spacing:1px}
.btn.sm{padding:10px;font-size:13px;letter-spacing:1px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.wheelwrap{position:relative;width:min(86vw,360px);height:min(86vw,360px);margin:4px auto 6px}
.wheelwrap::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.10),transparent 58%)}
.wheel{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
  box-shadow:0 0 0 6px #0d0f1b,0 0 0 8px #2a2f4a,0 18px 50px rgba(0,0,0,.6);
  transition:transform 2.6s cubic-bezier(.15,.85,.15,1);will-change:transform}
.hub{position:absolute;left:50%;top:50%;width:26%;height:26%;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle at 42% 36%,#2b3150,#12141f 70%);
  border:2px solid #3a4166;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--dim2);letter-spacing:1px;z-index:3}
.pointer{position:absolute;left:50%;top:-9px;transform:translateX(-50%);z-index:4;
  width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
  border-top:20px solid var(--gold);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.wtitle{font-size:12px;color:var(--dim);letter-spacing:2px;margin-bottom:2px}
.wsub{font-size:11px;color:var(--dim2)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.lg{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:5px;
  background:#12141f;border:1px solid var(--line);border-radius:999px;padding:4px 8px;max-width:100%}
.lg i{width:7px;height:7px;border-radius:50%;flex:none}
.result{margin:12px 0 4px;padding:14px;border-radius:14px;text-align:center;
  background:radial-gradient(120% 140% at 50% 0%,#2a2138,#141722 70%);
  border:1px solid #40365c;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.result .big{font-size:20px;font-weight:800;letter-spacing:1px;color:var(--gold)}
.result .small{font-size:11px;color:var(--dim)}
.hero{display:flex;gap:12px;align-items:center}
.avatar{width:56px;height:56px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:linear-gradient(145deg,#2a2f4a,#15172a);border:1px solid var(--line)}
.hname{font-size:17px;font-weight:800;letter-spacing:1px}
.hmeta{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.6}
.powerbadge{margin-left:auto;text-align:center;padding:6px 10px;border-radius:12px;
  background:linear-gradient(180deg,#3a2c14,#1d1608);border:1px solid #6b5320}
.powerbadge b{display:block;font-size:19px;color:var(--gold);line-height:1.1}
.powerbadge span{font-size:9px;color:#b99a5e;letter-spacing:1px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:#12141f;border:1px solid var(--line);border-radius:11px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:15px;color:var(--txt)}
.stat span{font-size:9px;color:var(--dim2);letter-spacing:1px}
.bar{height:5px;border-radius:3px;background:#0c0e17;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a3b2a,#e5484d);width:0%}
.slot{border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px;
  background:#12141f;display:flex;gap:10px;align-items:center}
.slot .ico{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  background:#1b1f33;border:1px solid #2c3252;overflow:hidden}
.slot .nm{font-size:13px;font-weight:700}
.slot .ds{font-size:10px;color:var(--dim2);margin-top:2px}
.slot .pw{margin-left:auto;font-size:12px;color:var(--gold);font-weight:800}
.tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:6px;margin:2px 3px 0 0;
  background:#1e2236;border:1px solid #333a5c;color:#b9c0dd}
.log{max-height:190px;overflow:auto;font-size:12px;line-height:1.85;color:var(--dim)}
.log p{margin:0 0 6px;padding-left:10px;border-left:2px solid #2a2f4a}
.log p.hl{border-color:var(--gold);color:var(--txt)}
.log p.bad{border-color:var(--red)}
.log p.good{border-color:var(--green)}
.log .t{color:var(--dim2);font-size:10px;margin-right:6px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,11,20,.92);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.tabbar div{flex:1;text-align:center;font-size:10px;color:var(--dim2);letter-spacing:1px;cursor:pointer}
.tabbar div i{display:block;font-size:17px;margin-bottom:2px;font-style:normal;opacity:.7}
.tabbar div.on{color:var(--gold)}
.tabbar div.on i{opacity:1}
.mask{position:fixed;inset:0;background:rgba(4,5,10,.82);z-index:80;display:flex;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--bg2);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:18px 16px 26px;
  animation:up .26s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h4{margin:0 0 12px;font-size:15px;letter-spacing:1px}
.opt{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer;
  background:#12141f;transition:.15s}
.opt:active{border-color:var(--gold)}
.opt b{font-size:13px;display:block;margin-bottom:3px}
.opt span{font-size:11px;color:var(--dim2);line-height:1.6}
.opt .risk{float:right;font-size:10px;color:var(--dim2)}
.runrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;background:#12141f;cursor:pointer}
.runrow .pw{margin-left:auto;color:var(--gold);font-weight:800;font-size:15px}
.runrow .dt{font-size:10px;color:var(--dim2)}
.chart{width:100%;height:150px;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px}
.cmp .k{color:var(--dim2)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:99;
  background:#1e2236;border:1px solid #3a4166;color:var(--txt);font-size:12px;
  padding:9px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>

/* ---- 辅助 ---- */
function tierV(k){ return (TIER_MAP[k]||TIER_MAP['D']).v; }
/* 同阶之内还有高低：下 / 中 / 上 / 极 */
const SUB_BANDS = [ {k:'下', v:0.00}, {k:'中', v:0.25}, {k:'上', v:0.50}, {k:'极', v:0.75} ];
const NAME_SUB = {
  '黄泉':3,'幻胧':1,'景元':2,'飞霄':2,'镜流':2,'刃':1,'卡芙卡':1,'流萤':2,'丹恒·饮月':2,
  '五条悟':3,'两面宿傩':3,'乙骨忧太':2,'夏油杰':1,'羂索':2,'魔虚罗':2,
  '克莱恩':3,'卢米安':3,'阿蒙':3,'罗塞尔':2,'贝尔纳黛':1,
  '吉尔伽美什':3,'所罗门':3,'盖提亚':3,'ORT':3,'提亚马特':2
};
function subIndex(pow, name){
  if(name && NAME_SUB[name] != null) return NAME_SUB[name];
  let h = 0; const s = String(name || pow || '');
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return h % 4;
}
function powInfo(pow, name){
  const t = TIER_MAP[pow] || TIER_MAP['C'];
  const si = subIndex(pow, name);
  return { base: t.v, si, sub: SUB_BANDS[si].v, label: pow + '·' + SUB_BANDS[si].k, value: t.v + SUB_BANDS[si].v };
}
function powVal(pow, name){ return powInfo(pow, name).value; }
function powLabel(pow, name){ return powInfo(pow, name).label; }
function hashSeed(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

      (d.factions||[]).forEach(f => POOL.faction.push({ world:wid, name:f.name, desc:f.desc||'' }));
      (d.topBeings||[]).forEach(b => POOL.top.push({ world:wid, name:b.name, pow:pw(b.pow), tags:tagsOf(b), desc:b.desc||'' }));
      (d.anchors||[]).forEach(a => POOL.anchor.push({ world:wid, name:a.name, tier:pw(a.tier), desc:a.desc||'' }));
    });
    // 兜底，防止资料缺失时整局跑不动
    if(!POOL.ability.length) POOL.ability.push({ world:'jjk', name:'基础打击', pow:'D', tags:['物理','近战'], desc:'' });
    if(!POOL.branch.length) WORLD_IDS.forEach(w=>POOL.branch.push({ world:w, name:'无体系', kind:'通用', levels:[{n:1,name:'未觉醒',pow:'D',tags:['物理'],desc:''}] }));
    if(!POOL.timeline.length) POOL.timeline.push({ world:'jjk', t:'某年', name:'平静的一天', desc:'' });
  }

  /* ---------- 随机 ---------- */
  function rnd(){ return R(); }
  function ri(a,b){ return a + Math.floor(R()*(b-a+1)); }
  function pick(arr){ return arr[Math.floor(R()*arr.length)]; }
  function chance(p){ return R() < p; }
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function worldWeights(){
    const av = availableWorlds();
    const w = S ? S.bias : {jjk:1,lotm:1,hsr:1,fgo:1};
    const arr = av.map(id => ({ id, w: Math.max(0.05, w[id]||1) }));
    const sum = arr.reduce((s,x)=>s+x.w,0);
    let r = R()*sum;
    for(const x of arr){ r -= x.w; if(r<=0) return x.id; }
    return arr[0].id;
  }
  function pickWorld(){ return worldWeights(); }

  function availableWorlds(){
    const a = WORLD_IDS.filter(id => branchesOf(id).length > 0);
    return a.length ? a : WORLD_IDS.slice();
  }

  /* ---------- 体系槽抽取 ---------- */
  function branchesOf(wid){ return POOL.branch.filter(b => b.world===wid); }
  function abilitiesOf(wid){ return POOL.ability.filter(a => a.world===wid); }

  /* ---------- 建局 ---------- */
  function newRun(seedStr, anchor){
    normalize();
    S = {
      id: 'run_' + Date.now().toString(36),
      seed: seedStr || String(Date.now()),
      anchor: anchor || 'jjk',
      time: new Date().toISOString(),
      chapter: 0, maxChapter: 14,
      bias: Object.fromEntries(WORLD_IDS.map(id=>[id,1])),
      char: {
        gen: {}, slots: [], stats: {}, hpMax:0, mpMax:0, hp:0, mp:0,
        tags: new Set(), powers: [], injuries: [], growth: [], abilities: [], reputation: 5
      },
      log: [], curve: [], phase: 'create', pending: [], mode: 'mixed',
      tally: { moves:0, breaks:0, wins:0, losses:0, easterIds:[], comeback:0, perfect:0 },
      flags: { cmdKill:false, godKill:false },
      world: anchor || 'jjk', ended: false
    };
    R = mulberry32(hashSeed(S.seed));
    S.era = pick(POOL.timeline.filter(t=>t.world===S.anchor)) || null;
    buildCreateQueue();
    buildMap(S.anchor);
    return S;
  }

  function buildCreateQueue(){
    const q = [];
    ['identity','gender','age','look','moral','origin'].forEach(k =>
      q.push({ type:'gen', id:k, title:GEN_TITLE[k], sub:GEN_SUB[k] }));
    q.push({ type:'slotcount', id:'slotcount', title:'体系数量', sub:'这一世你能背负几套体系' });
    S.pending = q;
  }
  const GEN_TITLE = { identity:'初始身份', gender:'性别', age:'年龄', look:'颜值', moral:'道德水平', origin:'出身' };
  const GEN_SUB = { identity:'你以什么身份来到这个世界', gender:'生理与自我认知', age:'开局年纪', look:'皮囊也是战力', moral:'底线在哪里', origin:'你的起点' };

  /* 返回当前需要抽取的步骤（含选项） */
  function currentStep(){
    while(S.pending.length && S.pending[0].done) S.pending.shift();
    const st = S.pending[0];
    if(!st) return null;
    if(st.type === 'world' || st.type === 'slot_world'){
      const used = new Set((S.char.slots||[]).map(s=>s.world));
      st.options = availableWorlds().map(id => ({
        key:id, world:id, label:WORLDS[id].name, sub:WORLDS[id].sys, pow:WORLDS[id].icon,
        w: (st.type==='slot_world' && !used.has(id)) ? 2.2 : 1
      }));
    } else if(st.type === 'gen'){
      const list = GEN_POOLS[st.id] || [];
      st.options = list.map(o => ({ key:o.n, world:'*', label:o.n, sub:o.d||'', pow:o.t }));
    } else if(st.type === 'slotcount'){
      st.options = [
        { key:'1', world:'*', label:'1 套体系', sub:'孤注一掷，走到极处', pow:'险', w:28 },
        { key:'2', world:'*', label:'2 套体系', sub:'一主一辅，比较稳', pow:'稳', w:38 },
        { key:'3', world:'*', label:'3 套体系', sub:'三修并行，代价不小', pow:'强', w:24 },
        { key:'4', world:'*', label:'4 套体系', sub:'四界同修，极难驾驭', pow:'逆天', w:10 }
      ];
    } else if(st.type === 'branch'){
      const wid = st.world;
      const taken = new Set(S.char.slots.filter(s=>s.world===wid && s.branch).map(s=>s.branch.name));
      let list = branchesOf(wid).filter(b => !taken.has(b.name));
      if(!list.length) list = branchesOf(wid);
      st._branches = list;
      st.options = list.map((b,i) => ({ key:i, world:wid, label:b.name, sub:b.kind, pow:'·' }));
    } else if(st.type === 'level'){
      const b = st.branch;
      let lv = b.levels.filter(l => l.pow !== 'EX');
      if(!lv.length) lv = b.levels;
      st._lv = lv;
      const lw = [6,3.6,2.2,1.3,0.8,0.5,0.32,0.2,0.13,0.08];
      st.options = lv.map((l,i) => ({ key:i, world:b.world, label:l.name, sub:'阶位 ' + l.n, pow:l.pow, w: lw[i] || 0.06 }));
    }
    return st;
  }

  /* 应用一次抽取结果 */
  function applyStep(step, idx){
    const opt = step.options[idx];
    if(step.type === 'world' || step.type === 'slot_world'){
      if(step.type === 'world'){ S.anchor = opt.world; S.world = opt.world;
        S.era = pick(POOL.timeline.filter(t=>t.world===opt.world)) || S.era;
      } else {
        const s = { index: +step.id.replace('slot',''), world: opt.world, branch:null, level:null };
        S.char.slots.push(s);
        // 紧接着压入 branch / level 两步
        const bStep = { type:'branch', id:step.id+'_b', world:opt.world, title:'第'+(s.index+1)+'体系 · ' + WORLDS[opt.world].axis, sub:'来自「'+WORLDS[opt.world].name+'」的'+WORLDS[opt.world].axis, slot:s };
        S.pending.splice(1,0,bStep);
      }
    } else if(step.type === 'branch'){
      const b = (step._branches || branchesOf(opt.world))[opt.key];
      step.slot.branch = b;
      const lStep = { type:'level', id:step.id+'_l', world:opt.world, branch:b, slot:step.slot, title:'第'+(step.slot.index+1)+'体系 · 深度', sub:b.name };
      S.pending.splice(1,0,lStep);
    } else if(step.type === 'level'){
      const l = (step._lv || step.branch.levels)[opt.key];
      step.slot.level = l;
      step.slot.pow = l.pow;
      if(!S.char.slots.find(s=>s===step.slot)) S.char.slots.push(step.slot);
    } else if(step.type === 'gen'){
      S.char.gen[step.id] = GEN_POOLS[step.id][opt.key] || { n:opt.label, t:opt.pow };
    } else if(step.type === 'slotcount'){
      const n = parseInt(opt.key, 10) || 1;
      S.slotCount = n;
      const arr = [];
      for(let i=0;i<n;i++) arr.push({ type:'slot_world', id:'slot'+i, title:'第'+(i+1)+'体系 · 源头', sub:'跨世界混合抽取' });
      S.pending.splice(1, 0, ...arr);
    }
    step.done = true;
    S.pending.shift();
    return opt;
  }

  function finishCreate(){
    const c = S.char;
    S.pending = [];
    // 属性
    const slots = c.slots.filter(s => s.level);
    const tv = slots.length ? slots.reduce((a,s)=>a+powVal(s.level.pow, s.level.name),0)/slots.length : 3;
    const best = slots.length ? Math.max(...slots.map(s=>powVal(s.level.pow, s.level.name))) : 3;
    const genT = (k)=>{ const g=c.gen[k]; return g? Math.max(1,tierV(g.t)) : 3; };
    const base = 20 + best*6;
    c.stats = {
      hp: base*3 + ri(0,30),
      mp: base*2 + ri(0,20),
      atk: base + Math.round(best*3.2) + ri(0,6),
      def: base + Math.round(genT('look')*1.5) + ri(0,6),
      spd: 10 + Math.round(best*2.4) + ri(0,8),
      spr: 10 + Math.round(genT('moral')*2) + ri(0,8),
      luck: 5 + ri(0,15)
    };
    c.hpMax = c.stats.hp; c.hp = c.stats.hp;
    c.mpMax = c.stats.mp; c.mp = c.stats.mp;
    slots.forEach(s => s.level.tags.forEach(t => c.tags.add(t)));
    c.power = calcPower();
    c.name = makeName();
    S.phase = 'life';
    S.chapter = 0;
    return S;
  }

  function makeName(){
    const a = ['林','沈','顾','苏','陆','白','夜','黎','季','江','许','温','楚','洛','谢'];
    const b = ['昭','临','渡','烬','烬','眠','川','野','时','雨','星','言','初','舟','栖','白','玄'];
    const c = pick(['', '', '', '·', '·']);
    return pick(a) + pick(b) + (c? c + pick(b) : '');
  }

  function calcPower(){
    const c = S.char;
    const slots = c.slots.filter(s=>s.level);
    if(!slots.length) return 10;
    const best = Math.max(...slots.map(s=>powVal(s.level.pow, s.level.name)));
    const avg = slots.reduce((a,s)=>a+powVal(s.level.pow, s.level.name),0)/slots.length;
    const synergy = 2.6*(new Set(slots.map(s=>s.world)).size - 1);   // 多修协同
    const tagBonus = Math.min(8, c.tags.size * 0.6);
    let v = 10 + best*5 + avg*2.6 + synergy + tagBonus + (c.reputation||5)*0.35;
    return Math.round(v);
  }
  function powerTier(v){
    if(v>=112) return 'EX'; if(v>=96) return 'SSS'; if(v>=84) return 'SS';
    if(v>=72) return 'S';  if(v>=60) return 'A';   if(v>=48) return 'B';
    if(v>=36) return 'C';  if(v>=24) return 'D';   if(v>=14) return 'E'; return 'E-';
  }

  /* ---------- 章节 ---------- */
  function chapterOptions(ev){
    return [
      { id:'in',  label:'主动参与', desc:'迎上去，风险与收益都最大', risk:'高' },
      { id:'watch', label:'谨慎观望', desc:'先看局势，稳步积累', risk:'低' },
      { id:'mess', label:'搅局/插手', desc:'不按剧本走，可能改变世界线', risk:'极高' }
    ];
  }

  function nextChapter(){
    S.chapter++;
    if(S.chapter > S.maxChapter || S.char.hp <= 0) return finish();
    if(S.map) S.map.moves = 1;
    const here = (S.map && S.map.nodes[S.map.pos]) ? S.map.nodes[S.map.pos].world : S.anchor;
    const pool = POOL.timeline;
    const weighted = [];
    pool.forEach(e => {
      let k = 1;
      if(e.world === here) k += 5;                          // 当前所在地世界的剧情更容易发生
      if(e.world === S.anchor && S.chapter <= 5) k += 2;
      if(e.world !== here && S.chapter >= 6) k += 1;
      for(let i=0;i<k;i++) weighted.push(e);
    });
    const ev = pick(weighted);
    S.curEvent = ev;
    S.curWorld = ev.world;
    return { type:'event', event: ev, chapter: S.chapter, options: chapterOptions(ev) };
  }

  function serendipity(){
    const c = S.char;
    const slots = c.slots.filter(s=>s.level && s.branch);
    if(!slots.length) return null;
    const s = pick(slots);
    const lines = [];
    const up = chance(0.58);
    const curV = tierV(s.level.pow);
    const fromName = `${WORLDS[s.world].short}·${s.branch.name}`;

    if(up){
      const idx = s.branch.levels.indexOf(s.level);
      const next = idx>=0 ? s.branch.levels[idx+1] : null;
      if(next && next.pow!=='EX' && chance(0.5)){
        s.level = next;
        next.tags.forEach(t=>c.tags.add(t));
        lines.push({ cls:'good', txt:`奇遇：你在「${s.level.name}」这一阶摸到了更上一层——${s.branch.name} 升至 ${next.name}。` });
      } else {
        const ws = availableWorlds().filter(w=>w!==s.world);
        const w = ws.length ? pick(ws) : s.world;
        const bs = POOL.branch.filter(b=>b.world===w);
        if(!bs.length) return lines;
        const nb = pick(bs);
        const near = nb.levels.filter(l=>l.pow!=='EX' && Math.abs(tierV(l.pow)-curV)<=1);
        const nl = near.length ? pick(near) : (nb.levels.filter(l=>l.pow!=='EX')[0] || nb.levels[0]);
        const old = fromName;
        s.world = w; s.branch = nb; s.level = nl;
        nl.tags.forEach(t=>c.tags.add(t));
        c.tags.add('虚空');
        lines.push({ cls:'good', txt:`奇遇：不属于此界的力量灌了进来——${old} 在「${s.level.name}」这一阶发生变异，成了 ${WORLDS[w].short}·${nb.name}·${nl.name}。` });
      }
      c.reputation += 1;
    } else {
      const idx = s.branch.levels.indexOf(s.level);
      if(idx > 0){
        s.level = s.branch.levels[idx-1];
        lines.push({ cls:'bad', txt:`奇遇：一次失败的仪式反噬了你，${fromName} 跌落至「${s.level.name}」。` });
      } else {
        c.reputation = Math.max(0, c.reputation-2);
        c.hp = Math.max(1, Math.round(c.hp*0.9));
        lines.push({ cls:'bad', txt:'奇遇：你被某种存在注视了一瞬，声望与生命都受了损。' });
      }
    }
    c.power = calcPower();
    return lines;
  }

  function applyChoice(optId){
    const ev = S.curEvent, c = S.char;
    const lines = [];
    const tag = { in:'#e8c37a', watch:'#9aa1c0', mess:'#e5484d' };
    lines.push({ cls:'hl', txt:`【第${S.chapter}章】${ev.t} · ${ev.name}（${WORLDS[ev.world].short}）` });
    if(ev.desc) lines.push({ cls:'', txt: ev.desc });

    // 世界权重漂移：进入该世界就越“串味”
    const w = ev.world;
    S.bias[w] = Math.min(3, S.bias[w] + 0.18);
    Object.keys(S.bias).forEach(k => { if(k!==w) S.bias[k] = Math.max(0.4, S.bias[k] - 0.03); });

    let roll = rnd();
    const mod = optId==='in' ? 0.12 : optId==='mess' ? -0.10 : 0;
    roll += mod;

    let battle = null;

    // 奇遇：约 14% 概率，脱离普通结果池
    if(chance(0.14)){
      const sl = serendipity();
      if(sl && sl.length){ sl.forEach(l => lines.push(l)); c.hp = Math.max(0, Math.min(c.hpMax, c.hp)); c.power = calcPower();
        S.curve.push({ ch:S.chapter, power:c.power, hp:c.hp/c.hpMax }); pushLog(lines);
        return { lines, battle:null, dead:c.hp<=0 }; }
    }

    if(roll < 0.30){
      lines.push({ cls:'bad', txt:'局势崩坏 —— 你被卷进了正面冲突。' });
      battle = makeEnemy(ev);
    } else if(roll < 0.62){
      const gains = ['体质','咒力/灵性','体术','精神','幸运'];
      const g = pick(gains);
      c.hpMax += ri(2,8);
      c.hp = Math.min(c.hpMax, c.hp + ri(10,22));
      c.reputation += 1;
      lines.push({ cls:'good', txt:`有所成长：${g}提升，生命上限 +，声望 +1。` });
      if(chance(0.5)){ const up = upgradeSlot(); if(up) lines.push({ cls:'good', txt:`阶位突破：${up}` }); }
      if(chance(0.45)) { const ab = grantAbility(); if(ab) lines.push({ cls:'good', txt:`习得新招式：${ab.name}（${ab.pow}）` }); }
    } else if(roll < 0.82){
      c.stats.spd += ri(0,2); c.stats.spr += ri(0,2);
      c.hp = Math.min(c.hpMax, c.hp + ri(6,14));
      lines.push({ cls:'', txt:'你躲在暗处观察，摸清了对手的路数（速度/精神小幅提升，稍作恢复）。' });
    } else {
      c.hp -= ri(8,26);
      lines.push({ cls:'bad', txt:'意外受伤，付出代价。' });
      if(chance(0.3)) { const ab = grantAbility(); if(ab) lines.push({ cls:'good', txt:`绝境中反而悟到：${ab.name}` }); }
    }
    c.hp = Math.max(0, Math.min(c.hpMax, c.hp));
    c.power = calcPower();
    S.curve.push({ ch:S.chapter, power:c.power, hp:c.hp/c.hpMax });
    pushLog(lines);
    return { lines, battle, dead: c.hp<=0 };
  }

  function makeEnemy(ev){
    let cands = POOL.top.filter(b => b.world===ev.world);
    if(!cands.length) cands = POOL.anchor.filter(a=>a.world===ev.world);
    const spec = cands.length ? pick(cands) : { name:'未知强敌', pow:'A', tags:['物理'] };
    const scale = 1 + S.chapter*0.12;
    const pTv = tierV(powerTier(S.char.power));
    const node = (S.map && S.map.nodes[S.map.pos]) ? S.map.nodes[S.map.pos] : null;
    const dangerUp = node && node.danger >= 3 ? 1 : 0;
    const baseCap = 3 + Math.floor(S.chapter*0.45);
    const capV = Math.min(10.75, Math.max(baseCap, pTv + (S.chapter>=6?1:0) + dangerUp));
    const tv = Math.min(powVal(spec.pow, spec.name), capV + 0.75);
    const tvLabel = powLabel(spec.pow, spec.name);
    return {
      name: spec.name, world: ev.world, tags: new Set(spec.tags||[]),
      stats: { hp: Math.round((60 + tv*26)*scale), atk: Math.round((12+tv*5)*scale), def: Math.round((8+tv*3)*scale), spd: Math.round(10+tv*2) },
      pow: powTierOf(tv), powLabel: tvLabel
    };
  }

  function powTierOf(v){
    if(v>=10.5) return 'EX'; if(v>=9) return 'SSS'; if(v>=8) return 'SS';
    if(v>=7) return 'S'; if(v>=6) return 'A'; if(v>=5) return 'B';
    if(v>=4) return 'C'; if(v>=3) return 'D'; return 'E';
  }

  function upgradeSlot(){
    const cands = S.char.slots.filter(s => {
      if(!s.level || !s.branch) return false;
      const idx = s.branch.levels.indexOf(s.level);
      return idx >= 0 && idx < s.branch.levels.length-1 && s.branch.levels[idx+1].pow !== 'EX';
    });
    if(!cands.length) return null;
    const s = pick(cands);
    const idx = s.branch.levels.indexOf(s.level);
    s.level = s.branch.levels[idx+1];
    s.level.tags.forEach(t => S.char.tags.add(t));
    S.char.power = calcPower();
    return `${s.level.name}（${WORLDS[s.world].short}·${s.branch.name}）`;
  }

  function grantAbility(){
    const w = pickWorld();
    const list = abilitiesOf(w);
    if(!list.length) return null;
    const ab = pick(list);
    S.char.abilities.push(ab);
    ab.tags.forEach(t=>S.char.tags.add(t));
    return ab;
  }

  function pushLog(lines){ lines.forEach(l => S.log.push({ ...l, ch:S.chapter })); }

  /* ---------- 战斗（一步一干预） ---------- */
  function baseMoves(tv){ return 1 + Math.floor(tv/2) + ri(0,1); }

  function battleInit(enemy){
    S.phase = 'battle';
    const pTv = tierV(powerTier(S.char.power)), eTv = tierV(enemy.pow);
    const b = {
      enemy, round: 1, maxRound: 5,
      win: { 0:0, 1:0 }, mult:{ 0:1, 1:1 }, skip:{ 0:false, 1:false }, extra:{ 0:0, 1:0 },
      heal:{0:0,1:0}, counter:{}, log: [], done:false, instant:-1,
      hp: { 0: S.char.hp, 1: enemy.stats.hp }, hpMax:{ 0:S.char.hpMax, 1:enemy.stats.hp },
      hpStart: S.char.hp, minP: 100, side: 0, used: {}, pl: S.char
    };
    b.pmoves = b.movesP = baseMoves(pTv);
    b.emoves = b.movesE = baseMoves(eTv) + 1;
    S.battle = b;
    dealHand();
    return b;
  }

  function actorTags(side){
    return side===0 ? S.char.tags : S.battle.enemy.tags;
  }

  function counterMult(atkTags, defTags, aTv, dTv){
    const at = [...atkTags], dt = [...defTags];
    const dfam = new Set(dt.map(t=>TAG_FAMILY[t]));
    let best = 1, note = '';
    for(const r of TAG_COUNTER){
      if(at.includes(r.a) && dt.includes(r.d) && r.m > best){ best = r.m; note = r.n; }
    }
    const afam = new Set(at.map(t=>TAG_FAMILY[t]));
    for(const f of afam){
      const row = FAMILY_COUNTER[f]; if(!row) continue;
      for(const g of dfam){ if(row[g] && row[g] > best){ best = row[g]; if(!note) note = FAMILY_NAME[f]+'克'+FAMILY_NAME[g]; } }
    }
    const has = (arr,t)=>arr.includes(t);
    if(has(at,'领域') && !has(dt,'领域')) { best = Math.max(best, 1.22); note = note||'领域压制'; }
    if(aTv - dTv >= 2) { best *= 1.10; }
    return { mult: Math.min(1.9, best), note };
  }

  function playerMovePool(){
    const out = [];
    S.char.slots.filter(s=>s.level && s.branch).forEach(s=>{
      const lv = s.branch.levels;
      const cur = lv.indexOf(s.level);
      [cur-1, cur, cur+1].forEach(i=>{
        const l = lv[i];
        if(l && l.name) out.push({ name:l.name, pow:l.pow, tags:l.tags, world:s.world });
      });
    });
    (S.char.abilities||[]).forEach(a=>out.push(a));
    return out;
  }
  function dealHand(){
    const b = S.battle;
    const cool = b.cool || [];
    let pool = playerMovePool().filter(m => !cool.includes(m.name));
    if(pool.length < 3) pool = playerMovePool();
    b.hand = shuffle(pool).slice(0, Math.min(3, pool.length));
    if(!b.hand.length) b.hand = [ { name:'基础打击', pow:'D', tags:['物理','近战'], world:S.anchor } ];
    b.cool = [];   // 冷却只持续一手
  }

  function drawMove(side){
    if(side===0){
      const slotWorlds = new Set(S.char.slots.map(s=>s.world));
      let pool = POOL.ability.filter(a => slotWorlds.has(a.world));
      if(S.char.abilities.length) pool = pool.concat(S.char.abilities, S.char.abilities);
      if(!pool.length) pool = POOL.ability;
      return pick(pool);
    }
    const wid = S.battle.enemy.world;
    let pool = POOL.ability.filter(a => a.world===wid);
    if(!pool.length) pool = POOL.ability;
    return pick(pool);
  }

  /* 走一步：玩家从三张手牌里选一张；对手随机出一招 */
  function battleStep(pick){
    const b = S.battle; if(!b || b.done) return b;
    const lines = [], names = ['你', b.enemy.name];
    const side = b.side;
    const tvP = tierV(powerTier(S.char.power)), tvE = tierV(b.enemy.pow);

    if(b.extra && b.extra[side]){
      if(side===0){ b.pmoves += b.extra[0]; b.movesP += b.extra[0]; dealHand(); }
      else { b.emoves += b.extra[1]; b.movesE += b.extra[1]; }
      b.extra[side] = 0;
    }

    if(!b.hand || !b.hand.length) dealHand();

    if(b.skip[side]){
      b.skip[side] = false;
      lines.push({ cls:'', txt: side===0 ? '你还在恍惚中，这一手没递出去。' : `${names[1]}陷入恍惚，无法行动。` });
    } else {
      const ab = (side===0 && b.hand[pick]) ? b.hand[pick] : drawMove(side);
      if(side===0){
        b.cool = b.cool || [];
        if(ab.name) b.cool.push(ab.name);          // 用过的这一手进一手冷却
        if(tierV(ab.pow) >= 9){                     // 高阶术式要付代价
          S.char.hp = Math.max(1, S.char.hp - Math.round(S.char.hpMax*0.05));
          lines.push({ cls:'bad', txt:`「${ab.name}」抽走了你 5% 生命` });
        }
      }
      const cm = counterMult(new Set(ab.tags), actorTags(1-side), side===0?tvP:tvE, side===0?tvE:tvP);
      const base = tierV(ab.pow)*6 + ri(2,10);
      const sideScale = side===0 ? 1 : (1 + S.chapter*0.05);
      const g = base * cm.mult * (b.mult[side]||1) * sideScale * (0.85 + rnd()*0.3);
      b.win[side] += g;
      if(b.mult[side] > 1) lines.push({ cls:'hl', txt:`${names[side]}这一手被强化了（×${b.mult[side].toFixed(2)}）` });
      b.mult[side] = 1;
      lines.push({ cls: side===0?'hl':'', txt:`${names[side]}使出「${ab.name}」 +${Math.round(g)}${cm.mult>1.15?'　克制×'+cm.mult.toFixed(2):''}` });
      if(cm.note && cm.mult>1.15) lines.push({ cls:'hl', txt:`克制触发：${cm.note} ×${cm.mult.toFixed(2)}` });
      if(b.heal[side]){
        const h = Math.round(b.hpMax[side]*b.heal[side]);
        b.hp[side] = Math.min(b.hpMax[side], b.hp[side] + h);
        lines.push({ cls:'good', txt:`${names[side]}恢复 ${h} 生命` });
        b.heal[side] = 0;
      }
    }

    if(side===0){
      b.pmoves--;
      if(b.pmoves<=0) b.side = 1;
      else dealHand();
    } else {
      b.emoves--;
      if(b.emoves<=0) endRound(lines);
    }
    const pNow = b.win[0]/(b.win[0]+b.win[1]+1)*100;
    b.minP = Math.min(b.minP===undefined?100:b.minP, pNow);

    b.log.push(...lines); S.log.push(...lines);
    return b;
  }

  function endRound(lines){
    const b = S.battle, names = ['你', b.enemy.name];
    if(b.round>=2 && chance(0.45)){
      const pD = (S.char.tags.has('领域')?1.6:1) * b.win[0];
      const eD = (b.enemy.tags.has('领域')?1.6:1) * b.win[1];
      const winner = pD>=eD ? 0 : 1;
      const add = b.win[winner]*0.5;
      b.win[winner] += add;
      lines.push({ cls:'hl', txt:`领域对抗：${names[winner]}压过对方，本回合加成翻倍（+${Math.round(add)}）` });
    }
    b.hpPct = b.hp[0]/b.hpMax[0]; b.tags = S.char.tags;
    if(chance(0.35)){
      const pool = EASTER.filter(e => { try{ return e.cond(b); }catch(_){ return false; } });
      if(pool.length){
        const e = pick(pool);
        b.counter.cmd = (b.counter.cmd||0) + (e.id==='seal'?1:0);
        const r = e.eff(b);
        if(!S.tally.easterIds.includes(e.id)) S.tally.easterIds.push(e.id);
        lines.push({ cls:'good', txt:`彩蛋「${e.n}」：${r}` });
      }
    }
    if(b.round >= b.maxRound || b.instant >= 0 || b.win[0] >= 1600 || b.win[1] >= 1600){
      settle(lines);
      return;
    }
    b.round++;
    const tvP = tierV(powerTier(S.char.power)), eTv = tierV(b.enemy.pow);
    b.pmoves = b.movesP = baseMoves(tvP);
    b.emoves = b.movesE = baseMoves(eTv);
    b.side = 0;
    dealHand();
    lines.push({ cls:'', txt:`—— 第 ${b.round} 回合 ——` });
  }

  function settle(lines){
    const b = S.battle;
    let winner;
    if(b.instant>=0) winner = b.instant;
    else {
      const diff = b.win[0] - b.win[1];
      winner = chance(1/(1+Math.exp(-diff/110))) ? 0 : 1;
    }
    b.done = true; b.winner = winner;
    if(winner===0){
      S.tally.wins++; bumpStat('wins');
      if(b.minP<=35) S.tally.comeback++;
      if(b.enemy.pow==='EX') S.flags.godKill = true;
      const inj = ri(0,2)===0 ? '重伤' : '轻伤';
      lines.push({ cls:'good', txt:`战斗结束：你赢了（${inj}）` });
      if(inj==='重伤'){ S.char.hp = Math.max(1, Math.round(S.char.hp*0.55)); S.char.injuries.push('战斗重伤'); }
      else { S.char.hp = Math.max(1, Math.round(S.char.hp*0.85)); }
      if(inj==='轻伤' && S.char.hp >= (b.hpStart||0)*0.8) S.tally.perfect++;
      S.char.wounds = 0;
      S.char.reputation += 2;
    } else {
      S.tally.losses++;
      lines.push({ cls:'bad', txt:'战斗结束：你败了。' });
      S.char.wounds = (S.char.wounds||0) + 1;
      S.char.hp = Math.max(1, Math.round(S.char.hp*0.45));
      if(S.char.wounds >= 2 && chance(0.5)){
        S.char.hp = 0; S.char.dead = true;
        lines.push({cls:'bad', txt:'旧伤复发，你没能再站起来。'});
      }
    }
    if(b.instant>=0) S.flags.cmdKill = true;
    b.hp[0] = S.char.hp;
    checkAch();
  }

  /* 干预：插在任意两步之间生效 */
  function battleIntervene(kind){
    const b = S.battle; if(!b || b.done) return null;
    b.used = b.used || {};
    if((b.used[kind]||0) >= 2) return '这类干预本场已经用尽了';
    if(kind==='burst'){
      b.mult[0] = (b.mult[0]||1) * 1.6;
      S.char.hp = Math.max(1, S.char.hp - Math.round(S.char.hpMax*0.06));
      b.used.burst = (b.used.burst||0)+1;
      return '你把生命力压进下一手：下一招 ×1.6（生命 -6%）';
    }
    if(kind==='guard'){
      const h = Math.round(b.hpMax[0]*0.08);
      b.hp[0] = Math.min(b.hpMax[0], b.hp[0] + h);
      S.char.hp = Math.min(S.char.hpMax, S.char.hp + h);
      b.used.guard = (b.used.guard||0)+1;
      return `你稳住呼吸，恢复 ${h} 生命`;
    }
    if(kind==='call'){
      b.pmoves += 1; b.movesP += 1;
      b.used.call = (b.used.call||0)+1;
      return '呼叫援护：本回合多出 1 次出招';
    }
    if(kind==='switch'){
      b.side = b.side===0 ? 1 : 0;
      b.used.switch = (b.used.switch||0)+1;
      return '你强行抢过了节奏——出手顺序被交换';
    }
    return null;
  }

  /* ---------- 结局 ---------- */
  function finish(){
    S.phase = 'end'; S.ended = true;
    const c = S.char;
    const alive = !c.dead && c.hp > 0;
    let rep = c.reputation + (alive?3:-5) + Math.round(c.power/25);
    rep = Math.max(0, rep);
    const repTier = rep>=26?'SSS':rep>=20?'SS':rep>=15?'S':rep>=11?'A':rep>=8?'B':rep>=5?'C':'D';
    const slots = c.slots.filter(s=>s.level);
    const counts = {};
    slots.forEach(s => counts[s.world] = (counts[s.world]||0)+1);
    const domWorld = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0] || S.anchor;
    const ctx = {
      alive, power:c.power, rep, repTier, chapter:S.chapter-1,
      hpPct: c.hpMax ? c.hp/c.hpMax : 1,
      has: t => c.tags.has(t), tags: c.tags,
      worldCount: new Set(slots.map(s=>s.world)).size,
      domWorld, slots
    };
    const ending = pickEnding(ctx);
    S.result = { alive, rep, repTier, power:c.power, pTier:powerTier(c.power), chapter:S.chapter-1,
                 endingId:ending.id, endingName:ending.name, endingRarity:ending.rarity };
    S.ending = ending;
    unlockEnding(ending.id);
    bumpStat('runs');
    saveRun();
    checkAch();
    return { type:'end', result:S.result, ending };
  }

  function unlockEnding(id){
    try{
      const k='wanjie_endings_v1';
      const a = JSON.parse(localStorage.getItem(k)||'[]');
      if(!a.includes(id)){ a.push(id); localStorage.setItem(k, JSON.stringify(a)); }
    }catch(e){}
  }
  function unlockedEndings(){ try{ return JSON.parse(localStorage.getItem('wanjie_endings_v1')||'[]'); }catch(e){ return []; } }

  /* ---------- 地图 / 区域封锁 ---------- */
  function buildMap(anchor){
    const nodes = [];
    const add = (wid, n, danger) => {
      let ps = POOL.place.filter(p=>p.world===wid);
      if(!ps.length) ps = [{ name:WORLDS[wid].name + '·无名之地', pow:'C' }];
      shuffle(ps).slice(0, n).forEach(p => nodes.push({ id:nodes.length, name:p.name, world:wid, danger, locked:false, need:null, reason:'' }));
    };
    add(anchor, 6, 1);
    availableWorlds().filter(w=>w!==anchor).forEach(w => add(w, 2, 2));
    const edges = [];
    for(let i=0;i<nodes.length;i++) edges.push([i,(i+1)%nodes.length]);
    for(let k=0;k<Math.max(2, Math.floor(nodes.length/4));k++){
      const a = ri(0,nodes.length-1), b = ri(0,nodes.length-1);
      if(a!==b) edges.push([a,b]);
    }
    const lockPool = [
      { r:'结界封锁', need:'空间' }, { r:'异闻带风暴', need:'规则' },
      { r:'圣杯战争结界', need:'召唤' }, { r:'虚数之潮', need:'虚空' },
      { r:'猩红之夜', need:'神圣' }
    ];
    const cand = shuffle(nodes.map((n,i)=>i).filter(i=>i>0));
    cand.slice(0, Math.min(3, Math.max(1, nodes.length-3))).forEach(i=>{
      const lr = pick(lockPool);
      nodes[i].locked = true; nodes[i].reason = lr.r; nodes[i].need = lr.need;
    });
    S.map = { nodes, edges, pos:0, moves:1, log:[] };
    return S.map;
  }

  function adjacent(i){
    if(!S.map) return false;
    return S.map.edges.some(e => (e[0]===S.map.pos && e[1]===i) || (e[1]===S.map.pos && e[0]===i));
  }
  function moveTo(i){
    const m = S.map; if(!m) return { ok:false, msg:'没有地图' };
    const n = m.nodes[i]; if(!n) return { ok:false, msg:'目标不存在' };
    if(i===m.pos) return { ok:false, msg:'你已在此地' };
    if(n.locked) return { ok:false, msg:`${n.name} 被「${n.reason}」封锁，需要突破。` };
    if(!adjacent(i)) return { ok:false, msg:'不相邻，无法直达' };
    if(m.moves<=0) return { ok:false, msg:'本章行动点已用完（每章只能移动一次）' };
    m.pos = i; m.moves--;
    S.tally.moves++;
    const line = `前往「${n.name}」（${WORLDS[n.world].short}·危险度 ${n.danger}）`;
    S.log.push({ ch:S.chapter, cls:'', txt: line });
    return { ok:true, msg:line };
  }
  function breakthrough(i){
    const m = S.map; if(!m) return { ok:false, msg:'没有地图' };
    const n = m.nodes[i]; if(!n || !n.locked) return { ok:false, msg:'此处并未封锁' };
    if(S.char.tags.has(n.need)){
      n.locked = false;
      S.tally.breaks++;
      S.log.push({ ch:S.chapter, cls:'good', txt:`你的「${n.need}」权柄撕开了${n.reason}，通路打开。` });
      checkAch();
      return { ok:true, msg:`以「${n.need}」破开${n.reason}！` };
    }
    const p = Math.max(0.15, Math.min(0.75, 0.2 + S.char.power/260));
    if(chance(p)){
      n.locked = false;
      S.tally.breaks++;
      S.char.hp = Math.max(1, S.char.hp - Math.round(S.char.hpMax*0.08));
      S.log.push({ ch:S.chapter, cls:'good', txt:`强行撕裂${n.reason}，付出了一些代价，但路通了。` });
      return { ok:true, msg:`强行破封成功（生命 -8%）` };
    }
    S.char.hp = Math.max(1, S.char.hp - Math.round(S.char.hpMax*0.12));
    S.log.push({ ch:S.chapter, cls:'bad', txt:`冲击${n.reason}失败，被反噬。` });
    return { ok:false, msg:'破封失败，遭到反噬。' };
  }

  /* ---------- 自定义世界 ---------- */
  function validateWorld(obj){
    const errs = [], warns = [];
    if(!obj || typeof obj !== 'object') return { ok:false, errs:['不是一个 JSON 对象'], warns };
    const id = String(obj.world || obj.id || '').trim();
    if(!/^[a-z0-9_-]{2,20}$/i.test(id)) errs.push('world 字段需要 2~20 位字母/数字/下划线');
    if(!obj.name) errs.push('缺少 name（世界名）');
    const br = obj.branches;
    if(!Array.isArray(br) || !br.length) errs.push('branches 不能为空（至少一个体系）');
    else br.forEach((b,i)=>{
      if(!b.name) errs.push(`branches[${i}] 缺少 name`);
      const lv = b.levels;
      if(!Array.isArray(lv) || !lv.length) errs.push(`branches[${i}] 缺少 levels`);
      else lv.forEach((l,j)=>{
        if(!l.name) errs.push(`branches[${i}].levels[${j}] 缺少 name`);
        if(!POW_VOCAB.includes(l.pow)) warns.push(`branches[${i}].levels[${j}] pow「${l.pow}」非法，已按 C 处理`);
        (l.tags||[]).forEach(t=>{ if(!TAG_VOCAB.includes(t)) warns.push(`未知标签「${t}」已忽略`); });
      });
    });
    ['abilities','topBeings','places','timeline'].forEach(k=>{ if(obj[k] && !Array.isArray(obj[k])) errs.push(`${k} 必须是数组`); });
    if(!Array.isArray(obj.abilities) || obj.abilities.length < 5) warns.push('abilities 少于 5 条，战斗会很单调');
    if(!Array.isArray(obj.timeline) || !obj.timeline.length) errs.push('timeline 不能为空（至少要有一个剧情事件）');
    return { ok: errs.length===0, errs, warns };
  }

  function sanitizeWorldList(arr, map){ return (arr||[]).filter(x=>x && x.name).slice(0,400).map(map); }

  function sanitizeWorld(obj){
    const clean = (arr, map) => (arr||[]).filter(x=>x && x.name).slice(0,400).map(map);
    const w = {
      world: String(obj.world||obj.id).trim(),
      name: obj.name, subtitle: obj.subtitle||'',
      branches: sanitizeWorldList(obj.branches, b => ({
        name: b.name, kind: b.kind || (WORLDS[obj.world] && WORLDS[obj.world].axis) || '体系',
        levels: (b.levels||[]).filter(l=>l && l.name).map((l,i)=>({
          n: l.n!=null?l.n:i+1, name:l.name, pow: POW_VOCAB.includes(l.pow)?l.pow:'C',
          tags:(l.tags||[]).filter(t=>TAG_VOCAB.includes(t)), desc:(l.desc||'').slice(0,60)
        }))
      })),
      topBeings: sanitizeWorldList(obj.topBeings, b => ({ name:b.name, pow: POW_VOCAB.includes(b.pow)?b.pow:'A',
        tags:(b.tags||[]).filter(t=>TAG_VOCAB.includes(t)), desc:(b.desc||'').slice(0,60) })),
      factions: sanitizeWorldList(obj.factions, f => ({ name:f.name, desc:(f.desc||'').slice(0,60) })),
      places: sanitizeWorldList(obj.places, p => ({ name:p.name, era:p.era||'', pow: POW_VOCAB.includes(p.pow)?p.pow:'C', desc:(p.desc||'').slice(0,60) })),
      timeline: sanitizeWorldList(obj.timeline, t => ({ t:t.t||'', name:t.name, desc:(t.desc||'').slice(0,80) })),
      abilities: sanitizeWorldList(obj.abilities, a => ({ name:a.name, pow: POW_VOCAB.includes(a.pow)?a.pow:'B',
        tags:(a.tags||[]).filter(t=>TAG_VOCAB.includes(t)), desc:(a.desc||'').slice(0,60) })),
      anchors: sanitizeWorldList(obj.anchors, a => ({ name:a.name, tier: POW_VOCAB.includes(a.tier)?a.tier:'A', desc:(a.desc||'').slice(0,60) }))
    };
    return w;
  }

  function registerWorld(metaIn, dataIn, opts){
    let data = dataIn || metaIn;
    const meta = metaIn && metaIn.name ? metaIn : (data && data.name ? data : null);
    if(!data || !data.name) return { ok:false, msg:'数据为空' };
    const v = validateWorld(data);
    if(!v.ok) return { ok:false, msg:v.errs.join('；'), warns:v.warns };
    const id = String(data.world||data.id).trim();
    const color = data.color || PALETTE[(id.length + id.charCodeAt(0)) % PALETTE.length];
    WORLDS[id] = {
      id, name:data.name, short:(data.name||'').slice(0,6), icon:data.icon||'✧', color,
      axis:data.axis||'体系', sys:data.sys||('自定义 · '+ (data.axis||'体系')),
      tiers:[], custom:true
    };
    if(!WORLD_IDS.includes(id)) WORLD_IDS.push(id);
    window.WORLD_DATA = window.WORLD_DATA || {};
    window.WORLD_DATA[id] = sanitizeWorld({...data, world:id});
    normalize();
    if(S){ S.bias = S.bias||{}; S.bias[id] = S.bias[id]||1; }
    if(!opts || opts.persist!==false) saveCustomWorlds();
    return { ok:true, msg:`已注册「${data.name}」：${window.WORLD_DATA[id].branches.length} 系 / ${window.WORLD_DATA[id].abilities.length} 招式 / ${window.WORLD_DATA[id].timeline.length} 事件`, warns:v.warns };
  }

  function customWorlds(){
    try{ return JSON.parse(localStorage.getItem('wanjie_custom_worlds')||'{}'); }catch(e){ return {}; }
  }
  function saveCustomWorlds(){
    try{
      const all = customWorlds();
      WORLD_IDS.forEach(id=>{
        if(WORLDS[id] && WORLDS[id].custom && window.WORLD_DATA[id]) all[id] = { meta: WORLD_META_PLAIN(id), data: window.WORLD_DATA[id] };
      });
      localStorage.setItem('wanjie_custom_worlds', JSON.stringify(all));
    }catch(e){}
  }
  function WORLD_META_PLAIN(id){
    const w = WORLDS[id];
    return { world:id, name:w.name, axis:w.axis, sys:w.sys, color:w.color, icon:w.icon };
  }
  function loadCustomWorlds(){
    const all = customWorlds();
    Object.keys(all).forEach(id=>{
      try{ registerWorld(all[id].meta, all[id].data, { persist:false }); }catch(e){}
    });
    return Object.keys(all).length;
  }
  function removeCustomWorld(id){
    try{
      const all = customWorlds(); delete all[id];
      localStorage.setItem('wanjie_custom_worlds', JSON.stringify(all));
    }catch(e){}
  }
  /* ---------- 成就 ---------- */

  }
  function checkAch(){
    if(!S) return [];
    const c = S.char, slots = c.slots.filter(s=>s.level);
    const worlds = new Set(slots.map(s=>s.world));
    const stats = gameStats(), un = unlockedEndings();
    const RAR = { 'C':3,'B':4,'A':5,'S':6,'SS':7,'SSS':8,'EX':9 };
    const best = ENDINGS.filter(e=>un.includes(e.id)).reduce((m,e)=>Math.max(m, RAR[e.rarity]||0), 0);
    const ctx = {
      worldCount: worlds.size,
      sameWorld: slots.length>=4 && worlds.size===1,
      maxSlotTier: Math.max(0, ...slots.map(s=>tierV(s.level.pow))),
      alive: !c.dead && c.hp > 0,
      power: c.power,
      rep: S.result ? S.result.rep : (c.reputation||0),
      hpPct: c.hpMax ? c.hp/c.hpMax : 1,
      deep: Math.min(S.chapter-1, S.maxChapter),
      tally: S.tally, flags: S.flags,
      life: { runs: stats.runs, wins: stats.wins, endings: un.length, bestEnding: best,
              hasEnding: id => un.includes(id),
              customs: Object.keys(customWorlds()).length,
              achvCount: Object.keys(achvAll()).length }
    };
    const out = [];
    ACHIEVEMENTS.forEach(a=>{
      try{ if(!achvAll()[a.id] && a.cond(ctx) && unlockAch(a.id)) out.push(a); }catch(e){}
    });
    if(out.length) S.pendingAch = (S.pendingAch||[]).concat(out);
    return out;
  }
  function consumeAch(){ const a = (S && S.pendingAch) || []; if(S) S.pendingAch = []; return a; }

  function saveRun(){
    try{
      const key='wanjie_runs_v1';
      const all = JSON.parse(localStorage.getItem(key)||'[]');
      all.unshift({
        id:S.id, time:S.time, seed:S.seed, anchor:S.anchor,
        name:S.char.name, gen:S.char.gen,
        slots:S.char.slots.map(s=>({world:s.world, branch:s.branch&&s.branch.name, level:s.level&&s.level.name, pow:s.level&&s.level.pow, kind:s.branch&&s.branch.kind})),
        power:S.char.power, tier:powerTier(S.char.power),
        result:S.result, curve:S.curve, tags:[...S.char.tags].slice(0,12),
        mode:S.mode
      });
      localStorage.setItem(key, JSON.stringify(all.slice(0,50)));
    }catch(e){}
  }
  function loadRuns(){ try{ return JSON.parse(localStorage.getItem('wanjie_runs_v1')||'[]'); }catch(e){ return []; } }
  function deleteRun(id){
    try{ const all = loadRuns().filter(r=>r.id!==id); localStorage.setItem('wanjie_runs_v1', JSON.stringify(all)); }catch(e){}
  }

  return {
    get S(){ return S; }, get POOL(){ return POOL; }, get R(){ return R; },
    newRun, currentStep, applyStep, finishCreate, calcPower, powerTier,
    nextChapter, applyChoice, makeEnemy, battleInit, battleStep, battleRound: battleStep, battleIntervene,
    finish, saveRun, loadRuns, deleteRun, grantAbility, pickWorld, branchesOf, abilitiesOf, normalize, availableWorlds,
    buildMap, moveTo, breakthrough, adjacent, unlockedEndings,
    checkAch, consumeAch, achvAll, gameStats,
    registerWorld, validateWorld, loadCustomWorlds, customWorlds, removeCustomWorld, saveCustomWorlds,
    pickIndex(n, weights){      if(!weights || !weights.length) return Math.floor(R()*n);
      const sum = weights.reduce((a,b)=>a+b,0);
      let r = R()*sum;
      for(let i=0;i<n;i++){ r -= weights[i]; if(r<=0) return i; }
      return n-1;
    },
    setMode(m){ if(S) S.mode = m; }
  };
})();

</script>

  function wheelHTML(title, sub, options, rotation, hi){
    const n = Math.max(1, options.length), step = 360/n;
    const C = 180, R = 170;
    const rad = d => d * Math.PI / 180;
    let paths = '', labels = '';
    options.forEach((o,i)=>{
      const a0 = i*step, a1 = (i+1)*step;
      const x0 = C + R*Math.sin(rad(a0)), y0 = C - R*Math.cos(rad(a0));
      const x1 = C + R*Math.sin(rad(a1)), y1 = C - R*Math.cos(rad(a1));
      const large = step > 180 ? 1 : 0;
      const mid = a0 + step/2;
      const on = (hi === i);
      paths += `<path d="M${C},${C} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z"
        fill="${PALETTE[i%PALETTE.length]}" stroke="${on?'#fff8e1':'rgba(8,9,16,.45)'}" stroke-width="${on?3:1}" opacity="${on?1:.92}"/>`;
      const r = n > 16 ? 112 : n > 10 ? 108 : 104;
      const tx = C + r*Math.sin(rad(mid)), ty = C - r*Math.cos(rad(mid));
      const arc = 2*Math.PI*r/n;
      let raw = String(o.label || '').replace(/^[「『【]/, '').replace(/[」』】]$/, '').trim();
      const cap = n <= 6 ? 8 : n <= 10 ? 6 : n <= 14 ? 4 : 3;
      let label = raw;
      if(label.length > cap){
        const head = raw.split(/[·・\/]/)[0].trim();
        label = (head && head.length <= cap) ? head : raw.slice(0, cap);
      }
      const fs = Math.max(9, Math.min(15, arc / (label.length * 1.0)));
      const pw = label.length * fs * 0.98 + 6, ph = fs + 4;
      labels += `<g>
        <rect x="${(tx - pw/2).toFixed(1)}" y="${(ty - ph/2).toFixed(1)}" width="${pw.toFixed(1)}" height="${ph.toFixed(1)}" rx="3.5" fill="rgba(6,7,12,.66)"/>
        <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" fill="#ffffff" font-size="${fs.toFixed(1)}" font-weight="700"
          text-anchor="middle" dominant-baseline="central" letter-spacing="0">${esc(label)}</text>
      </g>`;
    });
    return `<div class="stage">
      <div class="wtitle">${esc(title)}</div>
      <div class="wsub">${esc(sub||'')}</div>
      <div class="wheelwrap">

        <div class="hub">万界</div>
      </div>
      <div class="legend">${options.map((o,i)=>`<span class="lg"><i style="background:${PALETTE[i%PALETTE.length]}"></i>${esc(o.label).slice(0,7)}</span>`).join('')}</div>

  /* ---------------- 创建流程 ---------------- */
  function createView(){
    const st = ENG.currentStep();
    if(!st){ // 创建完成

          </div>` : '<div class="small">点击下方按钮开始旋转</div>'}
      </div>
      <button class="btn primary" id="spinBtn" ${spinning?'disabled':''} data-act="spin">${spinning?'旋转中…':(lastPick?'下一抽':'抽 取')}</button>
    </div>
    ${charCard(true)}`;
  }

  function doSpin(){
    if(spinning) return;

    // 上一抽还没落账：先记录，再换下一张盘
    if(pending){
      ENG.applyStep(pending.step, pending.idx);
      pending = null; lastPick = null;
      render();
      if(!ENG.currentStep()){ ENG.finishCreate(); screen='chapter'; render(); return; }
    }

    const st = ENG.currentStep();
    if(!st) return;
    const opts = st.options || [];
    if(!opts.length) { nextStep(); return; }
    const idx = ENG.pickIndex(opts.length, opts.map(o=>o.w||1));
    spinning = true;

    const w = $('#wheel');
    const btn = $('#spinBtn');
    const box = $('#resultBox');
    if(btn){ btn.disabled = true; btn.textContent = '旋转中…'; }
    if(box) box.innerHTML = '<div class="small" style="letter-spacing:4px;opacity:.75">命运正在转动…</div>';

    const n = opts.length, step = 360/n;
    const jitter = (Math.random()*0.24 - 0.12) * step;
    const target = 360*5 + (360 - (idx + 0.5)*step) + jitter;
    rot += target;
    if(w){
      // 双帧：先让浏览器确认起始角度，再改到目标角度，过渡才会从当前位置开始
      const from = rot - target;
      w.style.transition = 'none';
      w.style.transform = `rotate(${from}deg)`;
      void w.getBoundingClientRect();
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        w.style.transition = '';
        w.style.transform = `rotate(${rot}deg)`;
      }));
    }

    const delay = window.__SPIN_MS || 2650;
    setTimeout(()=>{
      try{
        pending = { step: st, idx };
        lastPick = st.options[idx];
        spinning = false;
        render();
      }catch(err){
        spinning = false;
        window.__spinErr = String(err) + ' | ' + (err && err.stack || '');
        render();
      }
    }, delay);
  }

  function nextStep(){
    const st = ENG.currentStep();
    if(st){ lastPick=null; render(); }
    else { ENG.finishCreate(); screen='chapter'; render(); }
  }

  /* ---------------- 章节 ---------------- */
  function chapterView(fresh){
    const s = S();
    if(fresh || !s.curEvent){
      const r = ENG.nextChapter();
      if(r && r.type === 'end'){ screen='end'; return endView(); }
      s._chapterOptions = r.options;
    }
    const ev = s.curEvent;
    const opts = s._chapterOptions || [];
    const auto = s.mode !== 'manual';
    const places = (ENG.POOL.place||[]).filter(p=>p.world===ev.world);
    const place = places.length ? places[Math.floor(Math.random()*places.length)] : null;
    if(auto && s._autoCh !== s.chapter){
      s._autoCh = s.chapter;
      setTimeout(()=>{ if(screen==='chapter' && S()===s && s.curEvent){
        const pickIds = ['in','watch','mess'];
        choose(pickIds[Math.floor(Math.random()*3)]);
      }}, 900);
    }
    return `<div class="card">
      <h3><span class="dot"></span>第 ${s.chapter} 章 · ${esc(ev.name)}</h3>
      <div class="sub" style="margin-bottom:8px">${esc(ev.t)} · 舞台：${WORLDS[ev.world].name}${place?` · ${esc(place.name)}`:''}</div>
      ${ev.img?`<div style="margin:8px 0;border-radius:12px;overflow:hidden;border:1px solid #2a2f4a">
        <img src="${esc(ev.img)}" alt="" style="width:100%;display:block" loading="lazy"></div>`
      : (window.WORLD_ART && window.WORLD_ART[ev.world] ? `<div style="position:relative;margin:8px 0;border-radius:12px;overflow:hidden;border:1px solid #2a2f4a">
        <img src="${window.WORLD_ART[ev.world].src}" alt="" style="width:100%;display:block;filter:brightness(.72) saturate(.9)" loading="lazy">
        <div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,9,16,.9),rgba(8,9,16,.15))"></div>
        <div style="position:absolute;left:12px;bottom:8px;font-size:11px;color:#dfe3f3;letter-spacing:2px">${esc(WORLDS[ev.world].name)}</div>
      </div>` : '')}
      <div class="sub" style="color:#c8cde8">${esc(ev.desc||'（此处无声胜有声）')}</div>
      <div style="margin-top:12px">
        ${opts.map(o=>`<div class="opt" data-act="choose" data-id="${o.id}">
          <span class="risk">风险 ${o.risk}</span><b>${esc(o.label)}</b><span>${esc(o.desc)}</span></div>`).join('')}
      </div>
      ${auto?'<div class="sub" style="text-align:center;margin-top:8px">当前为'+(s.mode==='auto'?'自动':'混合')+'模式，将自动推进（可在右上角切换）</div>':''}
    </div>

  }

    const s = S(); if(!s || !s.map) return '';

    const locked = s.map.nodes.filter(n=>n.locked).length;

  function logCard(n){
    const s = S(); if(!s) return '';
    const logs = s.log.slice(-(n||8)).reverse();
    return `<div class="card"><h3><span class="dot"></span>编年史</h3>
      <div class="log">${logs.map(l=>`<p class="${l.cls||''}"><span class="t">${l.ch?'第'+l.ch+'章':''}</span>${esc(l.txt)}</p>`).join('')||'<p>尚未开始。</p>'}</div></div>`;

  function choose(id){
    const r = ENG.applyChoice(id);
    if(r.dead){ ENG.finish(); screen='end'; render(); return; }
    if(r.battle){ ENG.battleInit(r.battle); battleLog = []; screen='battle'; render(); return; }
    S().curEvent = null;
    if(S().mode === 'auto') setTimeout(()=>{ render(); }, 300); else render();
  }

  /* ---------------- 战斗 ---------------- */
  function battleView(){
    const s = S(), b = s.battle;
    if(!b) { screen='chapter'; return chapterView(); }
    const pct = (a,c)=> Math.max(0,Math.min(100, a/(a+c+1)*100));
    const pA = pct(b.win[0], b.win[1]), pB = 100-pA;
    const logs = b.log.slice(-16);
    const cls = l => l.cls==='good'?'good':l.cls==='bad'?'bad':(l.txt.startsWith('你')?'hl':'');
    const myTurn = b.side===0;

    // 对手回合：一步一步自动打，中间随时可以干预
    if(!b.done && b.side===1 && !b._t){
      b._t = true;
      setTimeout(()=>{ b._t=false;
        if(screen==='battle' && S().battle===b && !b.done && b.side===1){ ENG.battleStep(); render(); }
      }, 520);
    }
    if(b.done && s.mode!=='manual' && !b._autoNext){
      b._autoNext = true;
      setTimeout(()=>{ if(screen==='battle' && S().battle===b){ document.querySelector('[data-act=battleEnd]')?.click(); } }, 1100);
    }
    return `<div class="card">
      <h3><span class="dot" style="background:#e5484d"></span>战斗 · 第 ${b.round} / ${b.maxRound} 回合
        <span class="sub" style="margin-left:auto">${b.done?'已结束':(myTurn?'你的行动':'对方行动中…')}</span></h3>
      <div class="row" style="align-items:center;margin-bottom:8px">
        <div style="text-align:left"><div class="nm" style="font-size:14px">${esc(char().name)}</div>
          <div class="ds">${ENG.powerTier(char().power)} · 剩 ${Math.max(0,b.pmoves)} 招</div></div>
        <div style="text-align:right"><div class="nm" style="font-size:14px">${esc(b.enemy.name)}</div>
          <div class="ds">${esc(b.enemy.powLabel||b.enemy.pow)} · 剩 ${Math.max(0,b.emoves)} 招</div></div>
      </div>
      <div class="bar" style="height:10px;border-radius:6px;background:#0c0e17">
        <i style="width:${pA}%;background:linear-gradient(90deg,#3fbf8f,#63d471)"></i>
      </div>
      <div class="sub" style="display:flex;justify-content:space-between;margin-top:6px">
        <span style="color:#63d471">胜率 ${Math.round(pA)}%</span>
        <span style="color:#e5484d">${Math.round(pB)}% 胜率</span>
      </div>
      <div class="log" id="battleLog" style="max-height:200px;margin-top:10px">${logs.map(l=>`<p class="${cls(l)}">${esc(l.txt)}</p>`).join('')||'<p>对峙中……</p>'}</div>
      ${b.done? `<button class="btn primary" data-act="battleEnd">战斗结束 · 继续</button>`
        : myTurn ? `<div class="sub" style="margin-top:10px">选择这一手 · 本回合还剩 ${Math.max(0,b.pmoves)} 招</div>
          <div style="display:grid;gap:8px;margin-top:6px">
            ${(b.hand||[]).map((m,i)=>`<div class="opt" data-act="play" data-i="${i}" style="margin:0">
              <span class="risk">${esc(powLabel(m.pow, m.name))}</span>
              <b>${esc(m.name)}</b><span>${esc((m.tags||[]).join(' · '))}</span></div>`).join('')}
          </div>
          <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="intervene">干 预</button></div>`
        : `<div class="sub" style="text-align:center;margin-top:10px">对方行动中……（可随时干预）</div>`}
    </div>
    ${charCard(true)}`;
  }

  function interveneSheet(){
    const b = S().battle || {};

    const opt = (k,t,d) => `<div class="opt" data-act="iv" data-k="${k}" style="${left(k)<=0?'opacity:.35;pointer-events:none':''}">

  /* ---------------- 结局 CG ---------------- */
  function cgSVG(e, opts){
    const [c1,c2,acc] = e.colors || ['#1a1f3a','#0a0b14','#e8c37a'];
    const seed = hashSeed(e.id);
    const rnd2 = mulberry32(seed);
    let art = '';
    const r = n => Math.round(rnd2()*n);
    if(e.art==='throne'){
      art += `<g opacity=".5">${Array.from({length:9},(_,i)=>`<path d="M180 520 L${60+i*30} 60" stroke="${acc}" stroke-width="1" opacity=".10"/>`).join('')}</g>`;
      art += `<path d="M120 520 L120 300 Q180 220 240 300 L240 520 Z" fill="${acc}" opacity=".10"/>`;
      art += `<path d="M150 520 L150 330 Q180 290 210 330 L210 520 Z" fill="${acc}" opacity=".18"/>`;
    } else if(e.art==='star'){
      for(let i=0;i<90;i++) art += `<circle cx="${r(360)}" cy="${r(520)}" r="${(rnd2()*1.4+0.3).toFixed(1)}" fill="#fff" opacity="${(rnd2()*0.7+0.2).toFixed(2)}"/>`;
      art += `<circle cx="250" cy="140" r="90" fill="${acc}" opacity=".10"/><circle cx="120" cy="360" r="70" fill="${acc}" opacity=".07"/>`;
    } else if(e.art==='train'){
      art += `<path d="M-20 430 L380 380" stroke="${acc}" stroke-width="2" opacity=".35"/>`;
      art += `<path d="M-20 470 L380 420" stroke="${acc}" stroke-width="1" opacity=".2"/>`;
      art += `<path d="M40 520 L190 300" stroke="${acc}" stroke-width="14" opacity=".12"/>`;
      art += `<circle cx="240" cy="180" r="60" fill="${acc}" opacity=".12"/>`;
    } else if(e.art==='door'){
      art += `<path d="M130 520 L130 190 Q180 120 230 190 L230 520 Z" fill="${acc}" opacity=".14"/>`;
      art += `<path d="M150 520 L150 210 Q180 160 210 210 L210 520 Z" fill="${acc}" opacity=".25"/>`;
      art += `<rect x="176" y="150" width="8" height="370" fill="${acc}" opacity=".12"/>`;
    } else if(e.art==='ruin'){
      for(let i=0;i<6;i++){ const x = 40+i*56, h = 120+r(180);
        art += `<rect x="${x}" y="${520-h}" width="22" height="${h}" fill="${acc}" opacity=".10"/>`; }
      art += `<path d="M0 520 L120 420 L240 470 L360 400 L360 520 Z" fill="#000" opacity=".4"/>`;
    } else if(e.art==='rain'){
      for(let i=0;i<70;i++){ const x=r(380), y=r(520);
        art += `<path d="M${x} ${y} l-10 26" stroke="${acc}" stroke-width="1" opacity="${(rnd2()*0.35+0.08).toFixed(2)}"/>`; }
      for(let i=0;i<8;i++){ const h=40+r(90), x=i*46; art += `<rect x="${x}" y="${520-h}" width="40" height="${h}" fill="#000" opacity=".35"/>`; }
    } else if(e.art==='flame'){
      for(let i=0;i<5;i++){ const x=60+i*58, h=120+r(160);
        art += `<path d="M${x} 520 Q${x+30} ${520-h} ${x+60} 520 Z" fill="${acc}" opacity="${(0.10+i*0.03).toFixed(2)}"/>`; }
      art += `<ellipse cx="180" cy="520" rx="220" ry="70" fill="${acc}" opacity=".12"/>`;
    } else if(e.art==='void'){
      for(let i=1;i<=6;i++) art += `<circle cx="180" cy="240" r="${i*28}" fill="none" stroke="${acc}" stroke-width="1" opacity="${(0.28-i*0.03).toFixed(2)}"/>`;
      art += `<circle cx="180" cy="240" r="34" fill="${acc}" opacity=".22"/>`;
    } else if(e.art==='shield'){
      art += `<path d="M180 120 L260 160 L250 320 Q180 420 110 320 L100 160 Z" fill="${acc}" opacity=".12" stroke="${acc}" stroke-width="2"/>`;
      art += `<path d="M180 170 L230 195 L222 305 Q180 370 138 305 L130 195 Z" fill="${acc}" opacity=".18"/>`;
    } else if(e.art==='crown'){
      art += `<path d="M110 300 L140 170 L180 250 L220 150 L250 300 Z" fill="${acc}" opacity=".18" stroke="${acc}" stroke-width="2"/>`;
      art += `<circle cx="180" cy="120" r="8" fill="${acc}" opacity=".6"/>`;
    }
    // 人物剪影
    const sil = `<g opacity=".95" fill="#05060a">
      <ellipse cx="180" cy="512" rx="46" ry="10" fill="#000" opacity=".6"/>
      <path d="M172 512 L172 430 Q166 400 172 382 Q178 366 180 356 Q182 366 188 382 Q194 400 188 430 L188 512 Z"/>
      <circle cx="180" cy="342" r="11"/>
    </g>
    <g opacity=".55"><path d="M188 512 L188 430 Q194 400 188 382 Q182 366 180 356" stroke="${acc}" stroke-width="1.2" fill="none"/>
      <circle cx="180" cy="342" r="11" fill="none" stroke="${acc}" stroke-width="1"/></g>`;
    // 浮尘
    let dust = '';
    for(let i=0;i<26;i++){
      dust += `<circle cx="${r(360)}" cy="${r(500)}" r="${(rnd2()*1.2+0.4).toFixed(1)}" fill="${acc}" opacity="${(rnd2()*0.35+0.05).toFixed(2)}"/>`;
    }
    return `<svg viewBox="0 0 360 520" style="width:100%;display:block" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="cg${e.id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
        </linearGradient>
        <radialGradient id="gl${e.id}" cx="50%" cy="35%" r="60%">
          <stop offset="0" stop-color="${acc}" stop-opacity=".35"/><stop offset="1" stop-color="${acc}" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vg${e.id}" cx="50%" cy="45%" r="75%">
          <stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/>
        </radialGradient>
      </defs>
      <rect width="360" height="520" fill="url(#cg${e.id})"/>
      <rect width="360" height="520" fill="url(#gl${e.id})"/>
      ${art}${dust}${sil}
      <rect width="360" height="520" fill="url(#vg${e.id})"/>
      ${opts&&opts.text?`<text x="180" y="70" text-anchor="middle" fill="${acc}" font-size="11" letter-spacing="4" opacity=".8">${esc(e.rarity)} ENDING</text>`:''}
    </svg>`;
  }
