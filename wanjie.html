  /* ---------------- 地图 ---------------- */
  function mapView(){
    const s = S();
    if(!s || !s.map) return `<div class="card"><h3><span class="dot"></span>地图</h3><div class="sub">开局后才有地图。</div></div>`;
    const m = s.map, n = m.nodes.length;
    const cx = 180, cy = 210, R = 128;
    const pos = m.nodes.map((nd,i)=>{
      const a = -Math.PI/2 + i*2*Math.PI/n;
      return [cx + R*Math.cos(a), cy + R*0.82*Math.sin(a)];
    });
    const lines = m.edges.map(([a,b])=>{
      const A = pos[a], B = pos[b], act = (a===m.pos||b===m.pos);
      return `<line x1="${A[0].toFixed(1)}" y1="${A[1].toFixed(1)}" x2="${B[0].toFixed(1)}" y2="${B[1].toFixed(1)}"
        stroke="${act?'#e8c37a':'#2a2f4a'}" stroke-width="${act?1.6:1}" opacity="${act?.8:.55}"/>`;
    }).join('');
    const dots = m.nodes.map((nd,i)=>{
      const [x,y] = pos[i];
      const col = WORLDS[nd.world] ? WORLDS[nd.world].color : '#888';
      const here = i===m.pos;
      const adj = ENG.adjacent(i);
      return `<g data-act="node" data-i="${i}" style="cursor:pointer">
        ${here?`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="#e8c37a" stroke-width="1.5" opacity=".9"/>`:''}
        <circle cx="${x}" cy="${y}" r="${nd.locked?8:9}" fill="${nd.locked?'#12141f':col}" stroke="${col}" stroke-width="1.5" opacity="${nd.locked?.5:1}"/>
        ${nd.locked?`<text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9" fill="${col}">锁</text>`:''}
        <text x="${x}" y="${y+22}" text-anchor="middle" font-size="8" fill="${here?'#e8c37a':(adj?'#c8cde8':'#6b7396')}">${esc(nd.name).slice(0,6)}</text>
      </g>`;
    }).join('');
    const cur = m.nodes[m.pos];
    return `<div class="card">
      <h3><span class="dot"></span>万界地图 <span class="sub">行动点 ${m.moves}</span></h3>
      <svg viewBox="0 0 360 420" style="width:100%;display:block">${lines}${dots}</svg>
      <div class="sub" style="margin-top:6px">当前位置：<b style="color:${WORLDS[cur.world].color}">${esc(cur.name)}</b>（${WORLDS[cur.world].short}·危险度 ${cur.danger}）</div>
      <div class="sub">每章可移动一次；点圆点查看或前往。被封锁的区域需要「突破」。</div>
    </div>
    ${charCard(true)}`;
  }

  function nodeSheet(i){
    const m = S().map, nd = m.nodes[i]; if(!nd) return;
    const here = i===m.pos, adj = ENG.adjacent(i);
    const canMove = adj && !here && !nd.locked && m.moves>0;
    $('#layers').innerHTML = `<div class="mask" data-act="closeSheet"><div class="sheet" data-stop="1">
      <h4>${esc(nd.name)} <span class="sub">· ${WORLDS[nd.world].name}</span></h4>
      <div class="sub" style="margin-bottom:10px">危险度 ${nd.danger}${nd.locked?` · 被「${esc(nd.reason)}」封锁（需要「${esc(nd.need)}」或强行突破）`:''}${here?' · 你在这里':''}</div>
      ${!here && !nd.locked && !adj?'<div class="sub" style="color:#e5484d">不相邻，需要先移动到相邻区域。</div>':''}
      <div class="row" style="margin-top:8px">
        ${canMove?`<button class="btn primary sm" data-act="move" data-i="${i}">前往（消耗行动点）</button>`:''}
        ${nd.locked?`<button class="btn ghost sm" data-act="break" data-i="${i}">尝试突破</button>`:''}
      </div>
      <button class="btn ghost sm" data-act="closeSheet" style="margin-top:8px">关闭</button>
    </div></div>`;
  }

  /* ---------------- 导入世界 ---------------- */
  function importSheet(){
    const customs = Object.values(ENG.customWorlds()||{});
    $('#layers').innerHTML = `<div class="mask" data-act="closeSheet"><div class="sheet" data-stop="1">
      <h4>导入自定义世界</h4>
      <div class="sub" style="margin-bottom:10px">粘贴 JSON，或选择文件。导入后会立即进入抽取池，并保存在本机。</div>
      <textarea id="worldJson" placeholder='{"world":"xxx","name":"...","branches":[...]}'
        style="width:100%;height:150px;background:#0d0f18;color:#e8eaf6;border:1px solid #2a2f4a;border-radius:10px;padding:10px;font-size:11px;font-family:ui-monospace,monospace"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost sm" data-act="pickFile">选择文件</button>
        <button class="btn ghost sm" data-act="dlTemplate">下载模板</button>
      </div>
      <button class="btn primary sm" data-act="doImport" style="margin-top:8px">校验并导入</button>
      <div id="importMsg" class="sub" style="margin-top:8px"></div>
      ${customs.length?`<div class="sub" style="margin-top:14px">已导入：</div>${customs.map(c=>`
        <div class="runrow"><div><div class="hname" style="font-size:13px">${esc(c.meta.name)}</div>
        <div class="dt">${esc(c.meta.world)} · ${(c.data.branches||[]).length} 系 / ${(c.data.abilities||[]).length} 招</div></div>
        <button class="btn ghost sm" data-act="delWorld" data-id="${esc(c.meta.world)}" style="width:auto;padding:6px 10px;font-size:11px">删除</button></div>`).join('')}`:''}
      <button class="btn ghost sm" data-act="closeSheet" style="margin-top:10px">关闭</button>
    </div></div>`;
    const fi = document.createElement('input');
    fi.type='file'; fi.accept='.json,application/json';
    fi.addEventListener('change', ()=>{
      const f = fi.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = ()=>{ const ta=$('#worldJson'); if(ta) ta.value = rd.result; toast('已读入文件'); };
      rd.readAsText(f, 'utf-8');
    });
    window.__filePicker = fi;
  }

  function doImport(){
    const ta = $('#worldJson'); if(!ta) return;
    const msg = $('#importMsg');
    let obj;
    try{ obj = JSON.parse(ta.value); }catch(e){ if(msg){msg.style.color='#e5484d'; msg.textContent='JSON 解析失败：'+e.message;} return; }
    const r = ENG.registerWorld(obj, obj);
    if(msg){
      msg.style.color = r.ok ? '#63d471' : '#e5484d';
      msg.textContent = r.ok ? (r.msg + (r.warns&&r.warns.length?('（提示：'+r.warns.slice(0,3).join('；')+'）'):'')) : ('导入失败：'+r.msg);
    }
    if(r.ok){ toast('世界已加入抽取池'); render(); }
  }

  function downloadTemplate(){
    const blob = new Blob([JSON.stringify(WORLD_TEMPLATE, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'world_template.json';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('模板已下载');
  }


  function endView(){
    const s = S(), r = s.result || {};
    const c = char();
    const e = s.ending || BEGINNINGS_FALLBACK();
    return `<div class="card" style="padding:0;overflow:hidden">
      ${cgView(e,{text:true})}
      <div style="padding:14px 14px 16px;text-align:center">
        <div class="sub" style="letter-spacing:6px">RUN COMPLETE</div>
        <div style="font-size:22px;font-weight:800;margin:6px 0;color:${r.alive?'#e8c37a':'#e5484d'}">${esc(r.endingName||'未知结局')}</div>
        <div class="sub">${esc(c.name)} · ${r.alive?'存活':'陨落'} · 第 ${r.chapter} 章</div>
        <div class="statgrid" style="grid-template-columns:repeat(3,1fr);margin-top:14px">
          <div class="stat"><b>${r.power}</b><span>战力 ${esc(r.pTier)}</span></div>
          <div class="stat"><b>${r.rep}</b><span>声望 ${esc(r.repTier)}</span></div>
          <div class="stat"><b>${[...c.tags].length}</b><span>机制标签</span></div>
        </div>
      </div>
    </div>
    ${charCard()}
    ${galleryCard()}
    <div class="row">
      <button class="btn primary" data-act="again">再来一局</button>
      <button class="btn ghost" data-act="archive">战力对比</button>
    </div>`;
  }
  function BEGINNINGS_FALLBACK(){
    return ENDINGS.find(x=>x.id==='passerby') || ENDINGS[0];
  }

  /* ---------------- 存档 / 对比 ---------------- */
  let cmpSel = [];
  function archiveView(){
    const runs = ENG.loadRuns();
    if(!runs.length) return `<div class="card"><h3><span class="dot"></span>存档</h3><div class="sub">还没有任何一局，先去跑一局吧。</div></div>`;
    const sel = cmpSel.map(id=>runs.find(r=>r.id===id)).filter(Boolean);
    return `<div class="card"><h3><span class="dot"></span>存档 · 选两局做对比</h3>
      ${runs.map(r=>{
        const on = cmpSel.includes(r.id);
        return `<div class="runrow" data-act="run" data-id="${r.id}" style="${on?'border-color:#e8c37a;background:#1b1a14':''}">
        <div><div class="hname" style="font-size:14px">${esc(r.name)} <span class="sub">· ${esc(r.anchor&&WORLDS[r.anchor]?WORLDS[r.anchor].short:r.anchor)}</span></div>
        <div class="dt">${esc((r.result&&r.result.title)||'')} · ${esc(r.tier)} · ${new Date(r.time).toLocaleDateString()}</div></div>
        <div class="pw">${r.power}</div>
        <button class="btn ghost sm" data-act="pick" data-id="${r.id}" style="width:auto;padding:7px 11px;font-size:11px;margin-left:6px">${on?'已选':'对比'}</button></div>`;
      }).join('')}
      ${cmpSel.length?`<button class="btn ghost sm" data-act="clearCmp">清空选择（${cmpSel.length}/2）</button>`:''}
    </div>
    ${sel.length>=2?compareCard(sel):''}
    <div class="card"><h3><span class="dot"></span>战力曲线</h3><canvas class="chart" id="chart"></canvas>
      <div class="sub" id="chartTip">${sel.length?'':'选中一局或两局查看成长曲线。'}</div></div>
    ${achvCard()}
    ${galleryCard()}`;
  }

  function compareCard(sel){
    const [a,b] = sel;
    const row = (k, va, vb) => `<div class="k">${k}</div><div>${esc(va)}</div><div class="k">${k}</div><div>${esc(vb)}</div>`;
    const slots = r => (r.slots||[]).filter(s=>s.level).map(s=>`${WORLDS[s.world].short}/${s.level}`).join(' + ') || '—';
    return `<div class="card"><h3><span class="dot" style="background:#63d471"></span>对比</h3>
      <div class="cmp" style="grid-template-columns:1fr 1fr;gap:6px 10px">
        <div style="font-weight:800;color:#63d471">${esc(a.name)}</div>
        <div style="font-weight:800;color:#e5484d">${esc(b.name)}</div>
        <div>战力 ${a.power}（${esc(a.tier)}）</div><div>战力 ${b.power}（${esc(b.tier)}）</div>
        <div>${esc((a.result&&a.result.title)||'')}</div><div>${esc((b.result&&b.result.title)||'')}</div>
        <div>声望 ${a.result?a.result.rep:'-'}</div><div>声望 ${b.result?b.result.rep:'-'}</div>
        <div class="sub" style="grid-column:1/-1;margin-top:6px">${esc(slots(a))}</div>
        <div class="sub" style="grid-column:1/-1">${esc(slots(b))}</div>
      </div></div>`;
  }

  function drawChart(runs){
    const cv = $('#chart'); if(!cv) return;
    const list = (runs||[]).filter(r=>r && r.curve && r.curve.length);
    if(!list.length) return;
    const dpr = window.devicePixelRatio||1;
    const w = cv.clientWidth, h = 150;
    cv.width = w*dpr; cv.height = h*dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);
    const pad = 18, all = list.flatMap(r=>r.curve.map(c=>c.power));
    const maxP = Math.max(...all), minP = Math.min(...all);
    const span = Math.max(6, maxP - minP);
    const yOf = p => h - pad - (h - pad*2) * ((p - minP + span*0.15) / (span*1.3));
    ctx.strokeStyle = '#2a2f4a'; ctx.lineWidth = 1;
    for(let i=0;i<=3;i++){ const y = pad + (h-pad*2)*i/3; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke(); }
    ctx.fillStyle = '#6b7396'; ctx.font = '9px sans-serif';
    ctx.fillText(String(maxP), 2, pad+8); ctx.fillText(String(minP), 2, h-pad);
    const colors = ['#63d471','#e5484d'];
    list.slice(0,2).forEach((r,idx)=>{
      const pts = r.curve.map((c,i)=>{
        const x = pad + (w-pad-6)*(i/Math.max(1,r.curve.length-1));
        return [x, yOf(c.power)];
      });
      ctx.strokeStyle = colors[idx]; ctx.lineWidth = 2; ctx.beginPath();
      pts.forEach((p,i)=> i? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.stroke();
      ctx.fillStyle = colors[idx]; pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],2.5,0,7); ctx.fill(); });
    });
  }

  function runSheet(id){
    const r = ENG.loadRuns().find(x=>x.id===id); if(!r) return;
    const html = `<div class="mask" data-act="closeSheet"><div class="sheet" data-stop="1">
      <h4>${esc(r.name)} · 战力 ${r.power}（${esc(r.tier)}）</h4>
      <div class="sub" style="margin-bottom:10px">${esc((r.result&&r.result.title)||'')} · ${r.slots.map(s=>s.level?`${WORLDS[s.world].short}/${s.level}`:'').filter(Boolean).join(' + ')}</div>
      <div style="margin-bottom:10px">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="row">
        <button class="btn ghost sm" data-act="chartRun" data-id="${r.id}">看曲线</button>
        <button class="btn ghost sm" data-act="delRun" data-id="${r.id}">删除</button>
      </div>
      <button class="btn ghost sm" data-act="closeSheet" style="margin-top:8px">关闭</button>
    </div></div>`;
    $('#layers').innerHTML = html;
  }

  /* ---------------- 渲染 ---------------- */
  function render(){
    const s = S();
    let body = '';
    if(screen==='archive') body = archiveView();
    else if(screen==='map') body = mapView();
    else if(!s) body = home();
    else if(screen==='create') body = createView();
    else if(screen==='chapter') body = chapterView();
    else if(screen==='battle') body = battleView();
    else if(screen==='end') body = endView();
    else body = home();
    $('#screens').innerHTML = body;
    if(screen==='battle'){ const lg=$('#battleLog'); if(lg) lg.scrollTop = lg.scrollHeight; }
    if(screen==='archive'){ const runs=ENG.loadRuns(); const sel=cmpSel.map(id=>runs.find(r=>r.id===id)).filter(Boolean); drawChart(sel.length?sel:runs.slice(0,1)); }
    renderTabs();
    renderMode();
    const newly = ENG.consumeAch();
    if(newly && newly.length){
      newly.forEach((a,i)=> setTimeout(()=> toast('★ 成就解锁：'+a.name+'（'+a.tier+'）'), 400 + i*1100));
    }
  }

  function renderTabs(){
    const tabs = [
      { id:'chapter', ico:'◎', label:'抽取' },
      { id:'map', ico:'◇', label:'地图' },
      { id:'char', ico:'◈', label:'角色' },
      { id:'log', ico:'≡', label:'编年史' },
      { id:'archive', ico:'▤', label:'存档' }
    ];
    $('#tabbar').innerHTML = tabs.map(t=>`<div class="${screen===t.id?'on':''}" data-act="tab" data-t="${t.id}"><i>${t.ico}</i>${t.label}</div>`).join('');
  }
  function renderMode(){
    const s = S();
    $('#modeBtn').innerHTML = `模式 <b>${MODE_CN[s?s.mode:'mixed']}</b>`;
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', e=>{
    const t = e.target.closest('[data-act]');
    if(!t) return;
    const act = t.dataset.act;
    if(act==='start'){
      screen='create'; lastPick=null; pending=null; rot=0; spinning=false;
      const w = t.dataset.w;
      ENG.newRun(String(Date.now()), w==='random'? WORLD_IDS[Math.floor(Math.random()*4)] : w);
      render(); return;
    }
    if(act==='spin'){ doSpin(); return; }
    if(act==='choose'){ choose(t.dataset.id); return; }
    if(act==='play'){ ENG.battleStep(+t.dataset.i); render(); return; }
    if(act==='step'){ ENG.battleStep(); return; }
    if(act==='intervene'){ interveneSheet(); return; }
    if(act==='iv'){ const msg=ENG.battleIntervene(t.dataset.k); $('#layers').innerHTML=''; toast(msg||'已干预'); render(); return; }
    if(act==='battleEnd'){ const b=S().battle; if(b) b.done=true; S().curEvent=null; S().phase='life';
      if(char().dead||char().hp<=0){ ENG.finish(); screen='end'; } else { screen='chapter'; }
      render(); return; }
    if(act==='again'){ screen='home'; render(); return; }
    if(act==='archive'){ screen='archive'; render(); return; }
    if(act==='run'){ runSheet(t.dataset.id); return; }
    if(act==='pick'){ const id=t.dataset.id;
      if(cmpSel.includes(id)) cmpSel=cmpSel.filter(x=>x!==id);
      else { cmpSel.push(id); if(cmpSel.length>2) cmpSel.shift(); }
      screen='archive'; render(); return; }
    if(act==='clearCmp'){ cmpSel=[]; render(); return; }
    if(act==='chartRun'){ const r=ENG.loadRuns().find(x=>x.id===t.dataset.id); $('#layers').innerHTML=''; screen='archive'; render(); drawChart([r]); return; }
    if(act==='delRun'){ ENG.deleteRun(t.dataset.id); $('#layers').innerHTML=''; render(); return; }
    if(act==='closeSheet'){ if(e.target.dataset.act==='closeSheet' || e.target.closest('[data-stop]')===null) $('#layers').innerHTML=''; return; }
    if(act==='tab'){
      const to = t.dataset.t;
      if(to==='char'){ openChar(); return; }
      if(to==='log'){ openLog(); return; }
      if(to==='map'){ screen='map'; render(); return; }
      if(to==='archive'){ screen='archive'; render(); return; }
      if(to==='chapter'){ if(!S()){screen='home';} else if(S().phase==='end'){screen='end';} else if(S().phase==='battle'){screen='battle';} else {screen='chapter';} render(); return; }
    }
    if(act==='node'){ nodeSheet(+t.dataset.i); return; }
    if(act==='move'){
      const r = ENG.moveTo(+t.dataset.i);
      $('#layers').innerHTML='';
      toast(r.msg);
      if(r.ok){ screen='map'; render(); } else { nodeSheet(+t.dataset.i); }
      return;
    }
    if(act==='break'){
      const r = ENG.breakthrough(+t.dataset.i);
      $('#layers').innerHTML='';
      toast(r.msg);
      screen='map'; render();
      return;
    }
    if(act==='viewCG'){ openCG(t.dataset.id); return; }
    if(act==='importWorld'){ importSheet(); return; }
    if(act==='pickFile'){ if(window.__filePicker) window.__filePicker.click(); return; }
    if(act==='dlTemplate'){ downloadTemplate(); return; }
    if(act==='doImport'){ doImport(); return; }
    if(act==='delWorld'){ ENG.removeCustomWorld(t.dataset.id); $('#layers').innerHTML=''; render(); toast('已删除该世界'); return; }
    if(act==='noop'){ return; }
    if(act==='mode'){ cycleMode(); return; }
  });

  function openChar(){
    if(!S()) { toast('还没有开局'); return; }
    $('#layers').innerHTML = `<div class="mask" data-act="closeSheet"><div class="sheet" data-stop="1">
      ${charCard()}<button class="btn ghost sm" data-act="closeSheet">关闭</button></div></div>`;
  }
  function openLog(){
    if(!S()) { toast('还没有开局'); return; }
    const logs = S().log.slice().reverse();
    $('#layers').innerHTML = `<div class="mask" data-act="closeSheet"><div class="sheet" data-stop="1">
      <h4>编年史</h4><div class="log" style="max-height:60vh">${logs.map(l=>`<p class="${l.cls||''}"><span class="t">${l.ch?'第'+l.ch+'章':''}</span>${esc(l.txt)}</p>`).join('')}</div>
      <button class="btn ghost sm" data-act="closeSheet" style="margin-top:10px">关闭</button></div></div>`;
  }
  function cycleMode(){
    const s = S(); if(!s){ toast('先开一局'); return; }
    const i = MODES.indexOf(s.mode);
    s.mode = MODES[(i+1)%3];
    ENG.setMode(s.mode);
    renderMode(); toast('切换为'+MODE_CN[s.mode]+'模式');
    if(screen==='chapter') render();
  }

  function toast(msg){
    const el = $('#toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 2200);
  }

  $('#modeBtn').addEventListener('click', cycleMode);

  return { render, toast, go(s){ screen = s; render(); }, init(){ ENG.loadCustomWorlds(); ENG.normalize(); render(); } };
})();
document.addEventListener('DOMContentLoaded', ()=> UI.init());

</script>
</body>
</html>
